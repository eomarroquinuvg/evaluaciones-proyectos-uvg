<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UVG | Portal de evaluadores</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap head"><strong>UVG | Evaluaciones de proyectos</strong><span>Portal de evaluadores</span></div></header><main class="wrap"><div id="message" role="status"></div><section class="card" id="login"><h2>Ingresar a evaluar</h2><p>Usá el usuario y contraseña proporcionados por el administrador.</p><div class="fields"><input id="username" autocomplete="username" placeholder="Usuario"><input id="password" autocomplete="current-password" type="password" placeholder="Contraseña"></div><button id="loginBtn">Iniciar sesión</button></section><section id="app" hidden><section class="card"><div class="between"><div><h2>Mis evaluaciones asignadas</h2><p id="who"></p></div><button id="logout" class="ghost">Cerrar sesión</button></div><div class="line"><select id="course"><option value="">Seleccionar curso</option></select><select id="group"><option value="">Seleccionar grupo</option></select><button id="open">Evaluar</button></div></section><div id="grading"></div></section><p class="footer">Universidad del Valle de Guatemala · Acceso por invitación</p></main><script src="evaluador.js"></script></body></html>
