<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados de proyectos | UVG</title><link rel="icon" type="image/png" href="../assets/logo-uvg.png"><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap head"><strong class="brand"><img src="../assets/logo-uvg.png" alt="Logo UVG">UVG | Resultados</strong><span>Consulta privada</span></div></header><main class="wrap"><section class="card"><h1>Consultar nota final</h1><p>Ingresá los datos proporcionados por tu docente. Solo se muestran los resultados publicados.</p><div class="fields"><input id="course" placeholder="Código del curso (ej. POO)" value="POO"><input id="year" type="number" value="2026"><input id="section" placeholder="Sección" value="50"><input id="group" type="number" placeholder="Grupo (1 a 5)"><input id="code" placeholder="Código POO-2026-XXXX"></div><button id="search">Consultar resultado</button><div id="result"></div></section></main><script>const $=id=>document.getElementById(id),api=localStorage.getItem('uvg_admin_api');$('search').onclick=async()=>{const r=$('result');r.textContent='Consultando...';try{if(!api)throw Error('La API todavía no está configurada. Abrí primero el portal /admin/ en este navegador.');const res=await fetch(api+'/public/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:$('course').value,year:+$('year').value,section:$('section').value,group:+$('group').value,code:$('code').value})});const d=await res.json();if(!res.ok)throw Error(d.error);r.replaceChildren();const h=document.createElement('h2');h.textContent=d.title+' · Sección '+d.section+' · Grupo '+d.group;const n=document.createElement('h1');n.className='grade';n.textContent=d.grade===null?'Sin nota':d.grade.toFixed(2)+' / 10';const p=document.createElement('p');p.textContent=d.comment||'Sin comentarios publicados.';r.append(h,n,p)}catch(e){r.textContent=e.message}};</script></body></html>
